name: Showcase checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check and build static files
        run: npm run check && npm run build
      - name: Install browser check tools
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.64.0
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Exercise website and capture previews
        run: node tests/showcase-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: showcase-browser-previews
          path: artifacts/
          retention-days: 7
