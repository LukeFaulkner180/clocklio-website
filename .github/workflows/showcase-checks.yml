name: Showcase checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check and build static files
        run: npm run check && npm run build
      - name: Install browser check tools
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.64.0
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Exercise website and capture previews
        run: node tests/showcase-smoke.mjs
      - name: Build and check GitHub Pages project paths
        run: npm run build && node scripts/check.mjs
        env:
          SITE_BASE_PATH: /clocklio-website
          SITE_URL: https://lukefaulkner180.github.io/clocklio-website/
          SITE_CHECK_DIRECTORY: dist
      - name: Exercise GitHub Pages navigation and calculators
        run: node tests/showcase-smoke.mjs
        env:
          QA_BASE_PATH: /clocklio-website
          QA_SITE_DIRECTORY: dist
          QA_ARTIFACT_DIRECTORY: artifacts/pages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: showcase-browser-previews
          path: artifacts/
          retention-days: 7
